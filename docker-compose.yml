services:
  fivem:
    image: ghcr.io/enz0z/fivem-docker
    # FiveM for GTAV Enhanced:
    # image: ghcr.io/enz0z/fivem-docker:enhanced
    container_name: fivem
    restart: always
    stdin_open: true
    tty: true
    # Enhanced only: Docker's default seccomp profile blocks io_uring and the server hangs at boot without it.
    # WARNING: this disables all syscall filtering for the container, see README.
    # security_opt:
    #   - seccomp=unconfined
    volumes:
      - "./config:/config"
      # Persist txAdmin data
      # - "./txData:/txData"
    ports:
      - "30120:30120"
      - "30120:30120/udp"
      # txAdmin web UI
      # - "40120:40120"
    environment:
      LICENSE_KEY: "license-key-here"
