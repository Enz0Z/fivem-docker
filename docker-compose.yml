services:
  fivem:
    image: ghcr.io/enz0z/fivem-docker
    container_name: fivem
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - "./config:/config"
      # Persist txAdmin data
      # - "./txData:/txData"
    ports:
      - "30120:30120"
      - "30120:30120/udp"
      # txAdmin web UI
      # - "40120:40120"
    environment:
      LICENSE_KEY: "license-key-here"
