name: update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream for a new FiveM build
        run: ./update.sh

      - name: Commit version bump
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          num=$(sed -n 's/^ARG FIVEM_NUM=//p' Dockerfile)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update FiveM to $num"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          num=$(sed -n 's/^ARG FIVEM_NUM=//p' Dockerfile)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:latest" -t "$image:$num" .
          docker push --all-tags "$image"
