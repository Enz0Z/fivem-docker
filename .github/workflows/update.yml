name: update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream for new FiveM builds
        run: ./update.sh

      - name: Commit version bumps
        id: commit
        run: |
          git config user.name "Enz0Z"
          git config user.email "48935178+Enz0Z@users.noreply.github.com"
          changed=$(./commit.sh)
          echo "$changed" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then git push; fi

      # Scheduled runs rebuild only what changed; manual runs and pushes rebuild both editions
      - name: Build and push images
        if: github.event_name != 'schedule' || steps.commit.outputs.legacy == 'true' || steps.commit.outputs.enhanced == 'true'
        env:
          ALL: ${{ github.event_name != 'schedule' }}
          LEGACY: ${{ steps.commit.outputs.legacy }}
          ENHANCED: ${{ steps.commit.outputs.enhanced }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          build() {
            edition=$1; shift
            num=$(sed -n 's/^FIVEM_NUM=//p' "$edition.env")
            docker build $(sed 's/^/--build-arg /' "$edition.env") \
              -t "$image:$edition" -t "$image:$edition-$num" "$@" .
          }
          if [ "$ALL" = true ] || [ "$LEGACY" = true ]; then build legacy -t "$image:latest"; fi
          if [ "$ALL" = true ] || [ "$ENHANCED" = true ]; then build enhanced; fi
          docker push --all-tags "$image"
